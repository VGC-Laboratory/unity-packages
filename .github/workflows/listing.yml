name: Build VPM Listing

# 全 Release の version entry を集めて index.json を作り、GitHub Pages で配信する。
# Release から毎回作り直すので、手で index.json を管理する必要はない。
#
# on: release: では起動しない。GITHUB_TOKEN が作成した Release は
# 他のワークフローをトリガーしない仕様のため、release.yml から uses: で呼ぶ。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.json を組み立てる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site entries
          # 各 Release に付いている <package id>-<version>.json を集める
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'com.vgc-laboratory.*.json' --dir entries --clobber || true
          done
          ls entries | sed 's/^/  取得: /'

          # {name, author, url, id, packages:{ <id>:{ versions:{ <ver>: entry } } }}
          jq -n \
            --arg url "https://vgc-laboratory.github.io/${GITHUB_REPOSITORY#*/}/index.json" \
            '{
               name: "VGC Laboratory",
               id: "com.vgc-laboratory.listing",
               author: "VGC-Laboratory",
               url: $url,
               packages: {}
             }' > site/index.json

          for f in entries/*.json; do
            [ -e "$f" ] || continue
            id=$(jq -r .name "$f")
            ver=$(jq -r .version "$f")
            jq --arg id "$id" --arg ver "$ver" --slurpfile e "$f" \
               '.packages[$id].versions[$ver] = $e[0]' site/index.json > site/tmp.json
            mv site/tmp.json site/index.json
          done

          jq '.packages | to_entries[] | "  \(.key): \(.value.versions | keys | join(", "))"' -r site/index.json

      - name: 案内用の index.html
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="ja"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>VGC Laboratory VPM Listing</title>
          <style>
            :root { color-scheme: light dark; }
            body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto;
                   padding: 0 1rem; line-height: 1.7; }
            code, pre { background: #8883; padding: .15em .4em; border-radius: 4px; }
            pre { padding: .8em; overflow-x: auto; }
            .btn { display: inline-block; background: #2b6cb0; color: #fff; text-decoration: none;
                   padding: .7em 1.4em; border-radius: 6px; font-weight: 600; }
            .btn:hover { background: #2c5282; }
            h3 { margin: 1.6em 0 .4em; font-size: 1.05rem; }
            h3 .hint { font-weight: 400; font-size: .85rem; opacity: .7; }
            ul { margin: .2em 0; }
            li { margin: .35em 0; }
          </style>
          <h1>VGC Laboratory VPM Listing</h1>

          <p><a class="btn" id="add" href="#">VCC に追加</a></p>
          <p><small>VRChat Creator Companion がインストールされている環境で開いてください。</small></p>

          <h2>手動で追加する場合</h2>
          <p>VCC の Settings &gt; Packages &gt; Add Repository に次の URL を入力します。</p>
          <pre id="u"></pre>

          <h2>収録パッケージ</h2>
          <div id="pkgs">読み込み中…</div>

          <p><a href="index.json">index.json</a> /
             <a href="https://github.com/VGC-Laboratory/unity-packages">リポジトリ</a></p>

          <script>
            var listing = location.origin + location.pathname.replace(/index\.html$/, '') + 'index.json';
            document.getElementById('u').textContent = listing;
            // VCC のカスタムURIスキーム。クリックで VCC が起動しリポジトリ追加を確認してくる
            document.getElementById('add').href = 'vcc://vpm/addRepo?url=' + encodeURIComponent(listing);
            // 版を新しい順に並べる。文字列比較だと 0.10.0 < 0.9.0 になるため数値で比べる
            function cmpVer(a, b) {
              function parts(v) {
                var m = /^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/.exec(v);
                if (!m) return [0, 0, 0, v];
                return [+m[1], +m[2], +m[3], m[4] || ''];
              }
              var pa = parts(a), pb = parts(b);
              for (var i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
              // prerelease 付きは同じ数値の正式版より古い
              if (pa[3] === pb[3]) return 0;
              if (pa[3] === '') return 1;
              if (pb[3] === '') return -1;
              return pa[3] < pb[3] ? -1 : 1;
            }

            // ワールド用かアバター用かは vpmDependencies から決まる。
            // package.json に独自フィールドは持たせない
            function target(entry) {
              var d = (entry && entry.vpmDependencies) || {};
              if (d['com.vrchat.worlds']) return 'world';
              if (d['com.vrchat.avatars']) return 'avatar';
              return 'both';
            }

            var SECTIONS = [
              ['world',  'ワールド用', 'ワールドのプロジェクトに入れます'],
              ['avatar', 'アバター用', 'アバターのプロジェクトに入れます'],
              ['both',   'どちらでも', 'ワールドにもアバターにも入れられます']
            ];

            fetch('index.json').then(function (r) { return r.json(); }).then(function (j) {
              var root = document.getElementById('pkgs');
              root.innerHTML = '';
              var buckets = { world: [], avatar: [], both: [] };

              Object.keys(j.packages || {}).forEach(function (id) {
                var vers = Object.keys(j.packages[id].versions).sort(cmpVer);
                var latest = j.packages[id].versions[vers[vers.length - 1]];
                buckets[target(latest)].push({ id: id, vers: vers, latest: latest });
              });

              SECTIONS.forEach(function (sec) {
                var items = buckets[sec[0]];
                if (!items.length) return;
                items.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
                var h = document.createElement('h3');
                h.innerHTML = sec[1] + ' <span class="hint">' + sec[2] + '</span>';
                root.appendChild(h);
                var ul = document.createElement('ul');
                items.forEach(function (it) {
                  var li = document.createElement('li');
                  li.innerHTML = '<strong>' + it.latest.displayName + '</strong> <code>' + it.id + '</code> ' +
                                 it.vers.slice().reverse().join(', ') +
                                 '<br><small>' + (it.latest.description || '') + '</small>';
                  ul.appendChild(li);
                });
                root.appendChild(ul);
              });

              if (!root.childNodes.length) root.textContent = 'パッケージがありません';
            }).catch(function () {
              document.getElementById('pkgs').textContent = '取得に失敗しました';
            });
          </script>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
