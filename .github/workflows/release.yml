name: Release

# 全パッケージを同一バージョンで揃えて出す（lockstep）。
# 手順: 各 package.json の version を上げて push → タグ v<version> を打つ
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョンを決める
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(jq -r .version Packages/com.vgc-laboratory.attributes/package.json)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "リリースバージョン: $V"

      - name: 全 package.json のバージョンが揃っているか確認
        run: |
          V="${{ steps.ver.outputs.version }}"
          fail=0
          for p in Packages/com.vgc-laboratory.*/package.json; do
            pv=$(jq -r .version "$p")
            if [ "$pv" != "$V" ]; then
              echo "::error file=$p::version が $pv でタグ $V と一致しません"
              fail=1
            fi
          done
          [ "$fail" = "0" ]

      - name: ZIP と version entry を作る
        run: |
          V="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}"
          mkdir -p out
          for dir in Packages/com.vgc-laboratory.*/; do
            id=$(jq -r .name "$dir/package.json")
            zip="out/${id}-${V}.zip"
            # package.json が ZIP のルートに来るように、パッケージ内から固める
            ( cd "$dir" && zip -r -q "$OLDPWD/$zip" . -x '.git/*' )
            sha=$(sha256sum "$zip" | cut -d' ' -f1)
            # listing の1バージョン分 = package.json + url + zipSHA256
            jq --arg url "${BASE}/${id}-${V}.zip" --arg sha "$sha" \
               '. + {url: $url, zipSHA256: $sha}' "$dir/package.json" > "out/${id}-${V}.json"
            echo "  $id  $V  $sha"
          done

      - name: Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "v${V}" out/* \
            --title "v${V}" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}" || \
          gh release upload "v${V}" out/* --clobber --repo "${GITHUB_REPOSITORY}"

  # GITHUB_TOKEN が作った Release は on: release: を発火させないため、ここから直接呼ぶ
  listing:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/listing.yml
