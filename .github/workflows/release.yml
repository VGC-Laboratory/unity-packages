name: Release

# パッケージごとに個別の版で出す。
# 手順: 対象の package.json の version を上げて push → タグ <短縮名>-v<version> を打つ
#   例) attributes-v0.5.0 → Packages/com.vgc-laboratory.attributes を 0.5.0 で出す
#       gimmicks-avatar-v2.0.2 → Packages/com.vgc-laboratory.gimmicks-avatar を 2.0.2 で出す
#
# 短縮名 = パッケージ ID から "com.vgc-laboratory." を取ったもの。
# タグ v<version>（全パッケージを同じ版で出す旧方式）はもう起動しない。
# 公開済みの v0.1.0〜v0.4.0 の Release と添付ファイルはそのまま残る。
on:
  push:
    tags: [ '*-v*' ]
  workflow_dispatch:
    inputs:
      package:
        description: '短縮名（例: attributes、gimmicks-avatar）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  guid-check:
    permissions:
      contents: read
    uses: ./.github/workflows/guid-check.yml

  release:
    needs: guid-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 対象パッケージと版を決める
        id: t
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            # 末尾の -v<version> を切り離す。短縮名にハイフンが入っていてもよい
            if [[ ! "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
              echo "::error::タグ '$TAG' が <短縮名>-v<version> の形ではありません"
              exit 1
            fi
            SHORT="${BASH_REMATCH[1]}"
            V="${BASH_REMATCH[2]}"
          else
            SHORT="${{ inputs.package }}"
            V=""
          fi

          DIR="Packages/com.vgc-laboratory.${SHORT}"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::$DIR/package.json がありません（短縮名 '$SHORT' が正しいか確認してください）"
            echo "存在するパッケージ:"
            for d in Packages/com.vgc-laboratory.*/; do
              basename "$d" | sed 's/^com\.vgc-laboratory\./  /'
            done
            exit 1
          fi

          PV=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1],encoding="utf-8"))["version"])' "$DIR/package.json")
          if [ -z "$V" ]; then
            V="$PV"
            echo "workflow_dispatch: package.json の version を使います: $V"
          elif [ "$PV" != "$V" ]; then
            echo "::error file=$DIR/package.json::version が $PV で、タグの版 $V と一致しません"
            exit 1
          fi

          ID=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1],encoding="utf-8"))["name"])' "$DIR/package.json")
          if [ "$ID" != "com.vgc-laboratory.${SHORT}" ]; then
            echo "::error file=$DIR/package.json::name が $ID で、フォルダ名から決まる ID と一致しません"
            exit 1
          fi

          {
            echo "short=$SHORT"
            echo "version=$V"
            echo "dir=$DIR"
            echo "id=$ID"
            echo "tag=${SHORT}-v${V}"
          } >> "$GITHUB_OUTPUT"
          echo "リリース対象: $ID $V （タグ ${SHORT}-v${V}）"

      - name: ZIP と version entry を作る
        run: |
          set -euo pipefail
          ID="${{ steps.t.outputs.id }}"
          V="${{ steps.t.outputs.version }}"
          DIR="${{ steps.t.outputs.dir }}"
          TAG="${{ steps.t.outputs.tag }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p out
          zip="out/${ID}-${V}.zip"
          # package.json が ZIP のルートに来るように、パッケージ内から固める
          ( cd "$DIR" && zip -r -q "$OLDPWD/$zip" . -x '.git/*' )
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          # listing の1バージョン分 = package.json + url + zipSHA256
          python3 tools/make-version-entry.py \
            "$DIR/package.json" "${BASE}/${ID}-${V}.zip" "$sha" "out/${ID}-${V}.json"
          echo "  $ID  $V  $sha"
          ls -l out

      - name: Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.t.outputs.tag }}"
          TITLE="${{ steps.t.outputs.id }} ${{ steps.t.outputs.version }}"
          gh release create "$TAG" out/* \
            --title "$TITLE" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}" || \
          gh release upload "$TAG" out/* --clobber --repo "${GITHUB_REPOSITORY}"

  # GITHUB_TOKEN が作った Release は on: release: を発火させないため、ここから直接呼ぶ
  listing:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/listing.yml
